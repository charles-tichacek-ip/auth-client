name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# No write access, no secrets: this workflow only checks the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=low
      # The committed dist/ is what apps install. It must be exactly what the source builds to.
      - name: dist/ matches a clean build
        run: |
          npm run build
          git diff --exit-code -- dist
          test -z "$(git ls-files --others --exclude-standard dist)"
